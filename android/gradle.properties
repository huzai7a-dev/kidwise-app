# Project-wide Gradle settings.

# Increase memory for Gradle daemon (important)
org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel execution for faster builds
org.gradle.parallel=true
org.gradle.daemon=true

# Required for RN Android builds
android.useAndroidX=true
android.enableJetifier=true

# RN architecture settings
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Hermes engine (recommended)
hermesEnabled=true

# Turbo architecture (Fabric) toggle
newArchEnabled=false
